<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>NESTBORN — Spider Hybrid v4</title>
  <style>
    :root {
      --bg: #0b0d0a;
      --panel: rgba(18, 20, 17, 0.9);
      --panel-border: rgba(210, 190, 140, 0.28);
      --gold: #d0b77b;
      --gold-soft: rgba(208, 183, 123, 0.35);
      --text: #efefe9;
      --muted: #a7a29a;
      --danger: #e8b5b5;
      --shadow: rgba(0, 0, 0, 0.55);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, sans-serif;
    }

    body {
      position: relative;
    }

    button {
      font: inherit;
    }

    #game {
      position: fixed;
      inset: 0;
      z-index: 1;
    }

    #game canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 50% 18%, rgba(68, 77, 58, 0.25), transparent 35%), var(--bg);
    }

    #lobby {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at 50% 35%, rgba(85, 92, 70, 0.2), transparent 38%),
        linear-gradient(180deg, rgba(8, 10, 7, 0.84), rgba(8, 10, 7, 0.96));
    }

    .panel {
      width: min(430px, 88vw);
      padding: 34px 28px;
      border: 1px solid var(--panel-border);
      border-radius: 18px;
      background: var(--panel);
      box-shadow: 0 18px 70px var(--shadow);
      text-align: center;
      backdrop-filter: blur(8px);
    }

    h1 {
      margin: 0;
      font-size: clamp(30px, 4vw, 42px);
      letter-spacing: 8px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .sub {
      margin: 8px 0 26px;
      color: var(--muted);
      font-size: 14px;
      letter-spacing: 1px;
    }

    .primary {
      width: 100%;
      padding: 14px 16px;
      margin: 6px 0;
      border: 1px solid #6c6149;
      border-radius: 10px;
      background: #302c23;
      color: var(--text);
      cursor: pointer;
      transition: 0.15s ease;
    }

    .primary:hover {
      background: #403a2e;
      border-color: #9b8b67;
    }

    .primary:active {
      transform: scale(0.985);
    }

    .primary:disabled {
      opacity: 0.55;
      cursor: wait;
    }

    .hint {
      margin-top: 14px;
      color: #777;
      font-size: 12px;
      line-height: 1.5;
    }

    #loading {
      display: none;
      margin-top: 14px;
      color: #b8ad91;
      font-size: 13px;
    }

    #error {
      display: none;
      margin-top: 16px;
      padding: 12px;
      border-radius: 9px;
      background: #321f1f;
      color: var(--danger);
      font-size: 12px;
      text-align: left;
      white-space: pre-wrap;
    }

    #hud {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 10;
      pointer-events: none;
    }

    .stats {
      position: absolute;
      left: 16px;
      top: 16px;
      width: 190px;
      padding: 12px;
      border-radius: 12px;
      background: rgba(10, 12, 9, 0.68);
      border: 1px solid rgba(255,255,255,0.08);
    }

    .stat {
      margin: 6px 0;
    }

    .label {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #bbb;
      margin-bottom: 4px;
    }

    .bar {
      height: 7px;
      background: #292c27;
      border-radius: 8px;
      overflow: hidden;
    }

    .fill {
      height: 100%;
      width: 50%;
      background: linear-gradient(90deg, #d0b77b, #f3d494);
    }

    #toast {
      position: absolute;
      left: 50%;
      bottom: 28px;
      transform: translateX(-50%);
      padding: 9px 15px;
      border-radius: 9px;
      background: rgba(8,10,7,0.8);
      opacity: 0;
      transition: 0.2s ease;
      pointer-events: none;
    }

    #controls {
      position: absolute;
      right: 15px;
      bottom: 15px;
      display: flex;
      gap: 8px;
      pointer-events: auto;
    }

    .ctrl {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.14);
      background: rgba(20,22,18,0.72);
      color: var(--text);
      cursor: pointer;
    }

    #touchMove {
      position: absolute;
      left: 20px;
      bottom: 20px;
      width: 130px;
      height: 130px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(20,22,18,0.35);
      pointer-events: auto;
      display: none;
    }

    #touchStick {
      position: absolute;
      left: 40px;
      top: 40px;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: rgba(210,195,155,0.3);
      transform: translate(-50%, -50%);
    }

    @media (max-width: 700px) {
      .panel { padding: 28px 22px; }
      #touchMove { display: block; }
      #controls { display: none; }
    }
  </style>
</head>
<body>
  <div id="game"></div>

  <div id="lobby">
    <div class="panel" id="lobbyPanel">
      <h1>NESTBORN</h1>
      <div class="sub">Spider Hybrid · The Hollow</div>

      <button class="primary" id="start">Войти в логово</button>
      <button class="primary" id="continue">Продолжить</button>
      <button class="primary" id="fullLobby">Полный экран</button>

      <div id="loading">Создаём логово…</div>
      <div id="error"></div>

      <div class="hint">v4 · Лобби и 3D-сцена запускаются независимо друг от друга</div>
    </div>
  </div>

  <div id="hud">
    <div class="stats">
      <div class="stat">
        <div class="label"><span>Голод</span><span id="hungerText">100</span></div>
        <div class="bar"><div class="fill" id="hungerFill"></div></div>
      </div>

      <div class="stat">
        <div class="label"><span>Жажда</span><span id="thirstText">100</span></div>
        <div class="bar"><div class="fill" id="thirstFill"></div></div>
      </div>

      <div class="stat">
        <div class="label"><span>Энергия</span><span id="energyText">100</span></div>
        <div class="bar"><div class="fill" id="energyFill"></div></div>
      </div>
    </div>

    <div id="toast"></div>

    <div id="touchMove">
      <div id="touchStick"></div>
    </div>

    <div id="controls">
      <button class="ctrl" id="fs">⛶</button>
      <button class="ctrl" id="save">💾</button>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    'use strict';

    (() => {
      const $ = id => document.getElementById(id);

      const stats = { hunger: 100, thirst: 100, energy: 100 };
      const keys = Object.create(null);

      let scene = null;
      let camera = null;
      let renderer = null;
      let clock = null;
      let player = null;
      let world = null;
      let gameInitialized = false;
      let gameStarting = false;
      let running = false;
      let paused = false;
      let loopStarted = false;

      let camYaw = 0;
      let camPitch = 0.5;
      let lastTime = 0;
      let moveX = 0;
      let moveZ = 0;

      function setLobbyBusy(busy) {
        $('start').disabled = busy;
        $('continue').disabled = busy;
        $('fullLobby').disabled = busy;
        $('loading').style.display = busy ? 'block' : 'none';
      }

      function showError(message) {
        $('loading').style.display = 'none';
        $('error').style.display = 'block';
        $('error').textContent = 'Не удалось запустить 3D-сцену.\n\n' + message + '\n\nПроверь, что файл открыт в браузере и есть доступ к Three.js.';
      }

      function updateHud() {
        $('hungerText').textContent = Math.round(stats.hunger);
        $('thirstText').textContent = Math.round(stats.thirst);
        $('energyText').textContent = Math.round(stats.energy);

        $('hungerFill').style.width = stats.hunger + '%';
        $('thirstFill').style.width = stats.thirst + '%';
        $('energyFill').style.width = stats.energy + '%';
      }

      function toast(message) {
        const toast = $('toast');
        toast.textContent = message;
        toast.style.opacity = '1';
        clearTimeout(toast._timer);
        toast._timer = setTimeout(() => {
          toast.style.opacity = '0';
        }, 1800);
      }

      function resetStats() {
        stats.hunger = 100;
        stats.thirst = 100;
        stats.energy = 100;
        updateHud();
      }

      function saveGame() {
        try {
          const data = {
            hunger: stats.hunger,
            thirst: stats.thirst,
            energy: stats.energy,
            playerX: player ? player.position.x : 0,
            playerY: player ? player.position.y : 0,
            playerZ: player ? player.position.z : 0
          };
          localStorage.setItem('nestborn-save-v4', JSON.stringify(data));
          toast('Сохранение готово.');
        } catch (e) {
          console.error(e);
          toast('Не удалось сохранить.');
        }
      }

      function loadGame() {
        try {
          const raw = localStorage.getItem('nestborn-save-v4');
          if (!raw) {
            resetStats();
            return;
          }
          const data = JSON.parse(raw);
          stats.hunger = Number.isFinite(data.hunger) ? data.hunger : 100;
          stats.thirst = Number.isFinite(data.thirst) ? data.thirst : 100;
          stats.energy = Number.isFinite(data.energy) ? data.energy : 100;
          if (player) {
            player.position.set(
              Number.isFinite(data.playerX) ? data.playerX : 0,
              Number.isFinite(data.playerY) ? data.playerY : 0,
              Number.isFinite(data.playerZ) ? data.playerZ : 0
            );
          }
          updateHud();
        } catch (e) {
          console.error(e);
          resetStats();
        }
      }

      async function fullscreen() {
        try {
          if (!document.fullscreenElement) {
            await document.documentElement.requestFullscreen?.();
          } else {
            await document.exitFullscreen?.();
          }
        } catch (e) {
          console.warn('Fullscreen unavailable', e);
        }
      }

      function setupGame() {
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0b0d0a);
        scene.fog = new THREE.Fog(0x0b0d0a, 12, 45);

        camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 200);
        camera.position.set(0, 2.3, 9);

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        $('game').appendChild(renderer.domElement);

        clock = new THREE.Clock();

        const hemi = new THREE.HemisphereLight(0xbbd3a6, 0x0b0d0a, 1.2);
        scene.add(hemi);

        const dir = new THREE.DirectionalLight(0xf8dca9, 1.2);
        dir.position.set(6, 12, 9);
        dir.castShadow = true;
        dir.shadow.mapSize.set(1024, 1024);
        scene.add(dir);

        const ground = new THREE.Mesh(
          new THREE.CircleGeometry(18, 64),
          new THREE.MeshStandardMaterial({ color: 0x171b16, roughness: 0.95, metalness: 0.05 })
        );
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        const ring = new THREE.Mesh(
          new THREE.TorusGeometry(7.5, 0.18, 14, 100),
          new THREE.MeshStandardMaterial({ color: 0x7d6a47, emissive: 0x17120a, roughness: 0.8 })
        );
        ring.rotation.x = Math.PI / 2;
        ring.position.y = 0.04;
        scene.add(ring);

        world = new THREE.Group();
        scene.add(world);

        for (let i = 0; i < 18; i++) {
          const pillar = new THREE.Mesh(
            new THREE.CylinderGeometry(0.7, 0.9, 2.5 + Math.random() * 2.3, 10),
            new THREE.MeshStandardMaterial({ color: 0x2d322f, roughness: 0.9, metalness: 0.1 })
          );
          const radius = 5 + Math.random() * 7;
          const angle = (i / 18) * Math.PI * 2;
          pillar.position.set(Math.cos(angle) * radius, 1.6, Math.sin(angle) * radius);
          pillar.castShadow = true;
          pillar.receiveShadow = true;
          world.add(pillar);
        }

        const particleGeo = new THREE.BufferGeometry();
        const particleCount = 250;
        const positions = new Float32Array(particleCount * 3);
        for (let i = 0; i < particleCount; i++) {
          positions[i * 3] = (Math.random() - 0.5) * 40;
          positions[i * 3 + 1] = Math.random() * 18 + 1;
          positions[i * 3 + 2] = (Math.random() - 0.5) * 40;
        }
        particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        const particles = new THREE.Points(
          particleGeo,
          new THREE.PointsMaterial({ color: 0xd8c5a0, size: 0.07, transparent: true, opacity: 0.9 })
        );
        scene.add(particles);

        player = new THREE.Group();

        const body = new THREE.Mesh(
          new THREE.SphereGeometry(1.05, 24, 24),
          new THREE.MeshStandardMaterial({ color: 0x9ea88e, roughness: 0.72, metalness: 0.16 })
        );
        body.scale.set(1.3, 1.0, 1.5);
        body.castShadow = true;
        player.add(body);

        const head = new THREE.Mesh(
          new THREE.SphereGeometry(0.56, 18, 18),
          new THREE.MeshStandardMaterial({ color: 0xd1c0a0, roughness: 0.82 })
        );
        head.position.set(0, 1.0, 0);
        head.castShadow = true;
        player.add(head);

        const eyeGeo = new THREE.SphereGeometry(0.08, 12, 12);
        const eyeMat = new THREE.MeshStandardMaterial({ color: 0x111111, emissive: 0x111111 });
        const leftEye = new THREE.Mesh(eyeGeo, eyeMat);
        const rightEye = new THREE.Mesh(eyeGeo, eyeMat);
        leftEye.position.set(-0.15, 1.02, 0.48);
        rightEye.position.set(0.15, 1.02, 0.48);
        player.add(leftEye, rightEye);

        player.position.set(0, 0.9, 0);
        scene.add(player);

        updateHud();
      }

      function startLoopOnce() {
        if (loopStarted) return;
        loopStarted = true;
        requestAnimationFrame(loop);
      }

      function loop() {
        if (!renderer || !scene || !camera || !player) {
          return;
        }

        const dt = Math.min(clock.getDelta(), 0.033);

        if (running && !paused) {
          const speed = 4.5;
          const forward = (keys.KeyW || keys.ArrowUp ? 1 : 0) - (keys.KeyS || keys.ArrowDown ? 1 : 0);
          const strafe = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0);

          moveX = strafe;
          moveZ = forward;

          const len = Math.hypot(moveX, moveZ) || 1;
          const dx = (moveX / len) * speed * dt;
          const dz = (moveZ / len) * speed * dt;

          player.position.x += dx;
          player.position.z += dz;
          player.position.x = Math.max(-12, Math.min(12, player.position.x));
          player.position.z = Math.max(-12, Math.min(12, player.position.z));

          const targetX = player.position.x + Math.sin(camYaw) * 8;
          const targetZ = player.position.z + Math.cos(camYaw) * 8;

          camera.position.x += (player.position.x + Math.sin(camYaw) * 7 - camera.position.x) * 0.09;
          camera.position.z += (player.position.z + Math.cos(camYaw) * 7 - camera.position.z) * 0.09;
          camera.position.y = 2.7 + Math.sin(camPitch) * 1.8;
          camera.lookAt(player.position.x, player.position.y + 1.3, player.position.z);

          stats.hunger = Math.max(0, stats.hunger - dt * 0.8);
          stats.thirst = Math.max(0, stats.thirst - dt * 1.0);
          stats.energy = Math.min(100, stats.energy + dt * 0.35);
          updateHud();
        }

        if (scene.children.length > 0) {
          scene.rotation.y += 0.0006;
        }

        renderer.render(scene, camera);
        requestAnimationFrame(loop);
      }

      function enterGame(loadSave) {
        if (gameStarting || gameInitialized) return;

        gameStarting = true;
        setLobbyBusy(true);
        $('error').style.display = 'none';

        setTimeout(() => {
          try {
            if (typeof THREE === 'undefined') {
              throw new Error('Three.js не загрузился.');
            }

            setupGame();
            if (loadSave) {
              loadGame();
            } else {
              resetStats();
            }

            gameInitialized = true;
            running = true;
            paused = false;

            $('lobby').style.display = 'none';
            $('hud').style.display = 'block';

            startLoopOnce();
            toast('Добро пожаловать домой.');
          } catch (err) {
            console.error('[NESTBORN v4]', err);
            showError(err && err.message ? err.message : String(err));
          } finally {
            gameStarting = false;
            setLobbyBusy(false);
          }
        }, 30);
      }

      document.addEventListener('keydown', (e) => {
        keys[e.code] = true;
        if (e.code === 'KeyF' && !e.repeat) fullscreen();
        if (e.code === 'KeyS' && !e.repeat) saveGame();
      });

      document.addEventListener('keyup', (e) => {
        keys[e.code] = false;
      });

      document.addEventListener('pointermove', (e) => {
        if (!running || !player) return;
        const x = (e.clientX / window.innerWidth) * 2 - 1;
        const y = (e.clientY / window.innerHeight) * 2 - 1;
        camYaw = x * 1.7;
        camPitch = THREE.MathUtils.clamp(0.5 + y * 0.8, 0.2, 1.2);
      });

      window.addEventListener('resize', () => {
        if (!renderer || !camera) return;
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      $('start').addEventListener('click', () => enterGame(false));
      $('continue').addEventListener('click', () => enterGame(true));
      $('fullLobby').addEventListener('click', fullscreen);
      $('fs').addEventListener('click', fullscreen);
      $('save').addEventListener('click', saveGame);

      updateHud();
    })();
  </script>
</body>
</html>
